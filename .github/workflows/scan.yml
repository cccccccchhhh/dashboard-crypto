name: scan-divergence

on:
  schedule:
    # Once a day, 10 minutes after the daily candle close (00:00 UTC = 07:00 WIB), so signals are built from the same closed
    # candles every time and never flip. Weekly candles close Monday 00:00 UTC and are picked up by the Monday run.
    - cron: "10 0 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scanner/scan.py
      - name: Commit updated history
        run: |
          git config user.name "divergence-bot"
          git config user.email "divergence-bot@users.noreply.github.com"
          git add public/data/history.json scanner/universe.json
          git diff --cached --quiet || (git commit -m "chore: daily divergence scan" && git pull --rebase && git push)
