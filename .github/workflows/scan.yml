name: scan-divergence

on:
  schedule:
    # 22:00 UTC = 05:00 WIB (requested morning run; scans the candles that already closed).
    # 00:10 UTC = 07:10 WIB: daily candles close 00:00 UTC (weekly: Monday 00:00 UTC), so this run catches the newest candle.
    - cron: "0 22 * * *"
    - cron: "10 0 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scanner/scan.py
      - name: Commit updated signals
        run: |
          git config user.name "divergence-bot"
          git config user.email "divergence-bot@users.noreply.github.com"
          git add public/data/signals.json scanner/universe.json
          git diff --cached --quiet || (git commit -m "chore: update divergence signals" && git push)
