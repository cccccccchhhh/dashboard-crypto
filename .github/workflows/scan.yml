name: scan-divergence

on:
  schedule:
    # Daily candles close 00:00 UTC, weekly candles close Monday 00:00 UTC. Run 10 min later (and again at 12:10 as a retry).
    - cron: "10 0 * * *"
    - cron: "10 12 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scanner/scan.py
      - name: Commit updated signals
        run: |
          git config user.name "divergence-bot"
          git config user.email "divergence-bot@users.noreply.github.com"
          git add public/data/signals.json scanner/universe.json
          git diff --cached --quiet || (git commit -m "chore: update divergence signals" && git push)
